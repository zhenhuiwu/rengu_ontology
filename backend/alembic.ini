[alembic]
script_location = migrations
# 模块迁移：--rev-id <模块>_<NNNN> → 文件名 <模块>_<NNNN>_<说明>.py（CONVENTIONS §16）
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
# 连接串从 app 配置读取（RENGU_DATABASE_URL），这里不写
timezone = Asia/Shanghai

[post_write_hooks]
hooks = ruff_fmt
ruff_fmt.type = exec
ruff_fmt.executable = ruff
ruff_fmt.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
