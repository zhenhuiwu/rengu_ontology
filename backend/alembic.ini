[alembic]
script_location = migrations
# Module revisions: --rev-id <module>_<NNNN> (CONVENTIONS section 16).
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
# Read the connection URL from app settings (RENGU_DATABASE_URL).
timezone = Asia/Shanghai

[post_write_hooks]
hooks = ruff_fmt
ruff_fmt.type = exec
ruff_fmt.executable = ruff
ruff_fmt.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
